name: Daily YouTube Video Bot

on:
  schedule:
    # Runs at 06:00 UTC every day (11:30 AM IST)
    - cron: "0 6 * * *"
  workflow_dispatch: # Manual trigger from the Actions tab
    inputs:
      dry_run:
        description: "Dry run — render videos but do NOT upload to YouTube (download them as artifacts instead)"
        type: boolean
        default: false

jobs:
  upload-videos:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ── 1. Checkout repo ─────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Python setup ──────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ── 3. System deps (fonts + ffmpeg) ──────────────────────────
      #     fonts-noto-core provides Noto Sans Tamil — the fallback if
      #     the bundled font download fails. Without a Tamil font every
      #     Tamil caption renders as empty boxes (tofu).
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            fonts-dejavu-core \
            fonts-noto-core
          echo "✅ System deps installed"
          find /usr/share/fonts -name "DejaVuSans-Bold.ttf" | head -1
          find /usr/share/fonts -name "NotoSansTamil-Bold.ttf" | head -1

      # ── 4. Python deps ───────────────────────────────────────────
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          echo "✅ Python deps installed"

      # ── 5. Verify secrets are present ────────────────────────────
      - name: Verify secrets
        run: |
          if [ -z "$GROQ_API_KEY" ]; then echo "❌ GROQ_API_KEY missing"; exit 1; fi
          if [ -z "$PEXELS_API_KEY" ]; then echo "❌ PEXELS_API_KEY missing"; exit 1; fi
          if [ -z "$YOUTUBE_TOKEN_JSON" ]; then echo "❌ YOUTUBE_TOKEN_JSON missing"; exit 1; fi
          echo "✅ All secrets present"
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}

      # ── 6. Run the bot ───────────────────────────────────────────
      - name: Run video bot
        run: python main.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}

      # ── 7. Save videos when they weren't uploaded ────────────────
      #     (dry run, or a pipeline failure after rendering)
      - name: Upload rendered videos as artifacts
        if: ${{ always() && (inputs.dry_run || failure()) }}
        uses: actions/upload-artifact@v4
        with:
          name: rendered-videos
          path: final_video_*.mp4
          if-no-files-found: ignore
          retention-days: 3
